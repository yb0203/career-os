# ---- Titles: a role needs a match in one family and none of the excludes.
titles:
  engineering:
    - '\b(ai|ml|llm|genai|gen ai|machine learning|applied ai|generative ai|nlp|agentic)\b.{0,25}\b(engineer|developer|scientist)\b'
    - '\b(engineer|developer)\b.{0,15}\b(ai|ml|llm|genai|machine learning|agents?)\b'
    - '\bforward[- ]deployed\b'
    - '\b(software|backend|back-end|full[- ]?stack|java|python|typescript|node(\.js)?|platform|api|integration|solutions?|product|developer experience|devex|developer productivity)\s+(engineer|developer|engineering)\b'
    - '\bmember of technical staff\b'
    - '\b(ai|ml)\s+(safety|evals?|evaluation)\b'
    - '\bevals?\s+engineer\b'
    - '\bagent(s|ic)?\s+(platform|infrastructure|engineer)'
    - '\bdeveloper advocate\b'
    - '\bsoftware (development )?engineer\b'
    - '\bsde\b'
  product:
    - '\b(technical|ai|ml|associate|junior)\s+(product|program)\s+(manager|owner)\b'
    - '\bproduct (manager|owner)\b'
    - '\bproduct management\b'
    - '\btechnical program(me)? manager\b'
    - '\btpm\b'
    - '\bapm\b'
    - '\bproduct lead\b'
  # Dropped even when an include matches: wrong discipline.
  exclude:
    - '\b(ios|android|embedded|firmware|mechanical|electrical|hardware|manufacturing|civil|chemical|network engineer|field engineer|support engineer|customer support|technical support|sales engineer|qa|quality assurance|sdet|test engineer|test automation|data centre|data center|site reliability|devops engineer|security engineer|cyber|salesforce|sap|abap|dynamics|servicenow|wordpress|shopify|unity developer|game developer|graphics|rendering|web designer|product designer|product marketing|product design|product operations|product analyst|marketing|recruit|sales|account (executive|manager)|legal|counsel|finance|accountant|payroll|hr |people partner|copywriter|designer|intern(ship)?|working student|werkstudent|praktikum|trainee|apprentice|ausbildung|thesis)\b'
  # Senior-and-above: she has ~3 years, so drop these.
  seniority_exclude:
    - '\b(senior|sr\.?|staff|principal|lead|head of|director|vp|vice president|chief|distinguished|fellow|architect|expert|group product|engineering manager|manager of|team lead|tech lead|iii|iv|level 3|level 4|l[4-9])\b'
  junior_boost:
    - '\b(junior|associate|graduate|entry[- ]level|new grad|early career|apm|(software|engineer|developer|manager)\s+(i|1|ii|2))\b'
  ai_title: '\b(ai|a\.i\.|ml|llm|llms|genai|gen ai|machine learning|deep learning|generative|nlp|agent|agents|agentic|rag|copilot|applied scientist|mlops|evals?)\b'

# Years of experience asked above this => drop (about 0-5 years requested).
max_years_required: 5
# Postings older than this are skipped (when a posting date is known).
max_age_days: 120

# ---- Visa / relocation / remote signal phrases (regex, case-insensitive).
sponsorship:
  # Hard negatives: reject outright.
  negative_strong:
    - 'no (visa )?sponsorship'
    - '\b(unable|not able|cannot|can ?not|can''t|won''t|will not|do not|don''t|does not|doesn''t|not)\b[^.\n]{0,40}\bsponsor'
    - 'sponsorship\b[^.\n]{0,25}\b(not (available|offered|provided)|unavailable)'
    - '\b(not|no)\b[^.\n]{0,20}\b(offer|provide|available)\b[^.\n]{0,20}\b(visa|relocation|work permit)'
    - 'without (requiring|needing|the need for)[^.\n]{0,20}sponsorship'
    - '\b(eu|eea|european) (citizens?|nationals?|passport) only'
    - '\bonly (open|available) to (eu|eea|european)'
    - '\b(us|u\.s\.|united states|canada) (only|residents only|based only)\b'
    - 'must (be located|reside|be based|live)[^.\n]{0,25}\b(us|u\.s\.|united states|canada)\b'
    - 'no relocation'
    - 'relocation[^.\n]{0,25}\bnot (available|offered|provided|supported)'
  # Soft negatives: reject unless the same posting offers sponsorship explicitly.
  negative_soft:
    - 'right to work (in|within)'
    - '(eligible|authori[sz]ed|permitted|entitled|legally (able|allowed)|allowed) to work (in|within)'
    - 'work (permit|authori[sz]ation|visa) (is |are )?(already )?required'
    - 'must (already )?(have|hold|possess)[^.\n]{0,40}\b(right|permit|authori[sz]ation|visa|citizenship)'
    - '\b(valid|existing) (eu |uk )?(work )?(permit|visa|residence)'
  positive:
    - 'visa sponsorship'
    - 'sponsor(?:s|ing|ed)?\b[^.\n]{0,25}\b(visa|work[- ]permit|immigration|blue card|your (visa|permit))'
    - '\b(visa|work[- ]permit|immigration|blue card|work authori[sz]ation)\b[^.\n]{0,60}\b(sponsor|support|assist|provid|offer|help|cover|handle|arrang)'
    - '\b(sponsor\w*|support\w*|assist\w*|provid\w*|offer\w*|help\w*|cover\w*|arrang\w*)\b[^.\n]{0,40}\b(visa|work[- ]permit|immigration|blue card|relocation)'
    - 'relocation (support|assistance|package|bonus|budget|allowance|benefit|help|services|stipend|offered)'
    - 'relocat\w+ (is |are )?(offered|provided|available|supported|covered|possible)'
    - 'we (can |will )?help you (to )?relocate'
    - 'blue card'
    - 'visa (support|assistance)'
  # Words in the matched sentence that mean the signal is about visas rather than just moving.
  visa_words: 'visa|work[- ]permit|immigration|blue card|sponsor|work authori[sz]ation'
  negation_words: '\b(no|not|never|unable|cannot|can''t|don''t|doesn''t|unfortunately|without|isn''t|aren''t|won''t)\b'

remote:
  # Location text or description meaning "open to India / anywhere".
  worldwide:
    - '\bworldwide\b'
    - '\banywhere\b'
    - '\bglobal(ly)?\b'
    - '\bwork from anywhere\b'
    - '\bany (country|location)\b'
    - 'open to candidates (from|in) (any|all)'
  # EU/EMEA remote: needs a manual check of the working-rights wording.
  europe: ['\bemea\b', '\beu\b', '\beea\b', '\beurope(an)?\b', '\bcet\b', '\bcest\b', '\bgmt\b']
  # Not open to her: remote restricted to these.
  excluded: ['\bus\b', '\busa\b', '\bunited states\b', '\bamericas?\b', '\bcanada\b', '\blatam\b', '\bnorth america\b', '\buk only\b', '\bcitizens? only\b']

# ---- Apply method from the link's host.
apply_hosts:
  direct: [greenhouse.io, lever.co, ashbyhq.com, workable.com, smartrecruiters.com, personio.de, personio.com,
           teamtailor.com, recruitee.com, join.com, comeet.com, breezy.hr, homerun.co, pinpointhq.com,
           jobs.gem.com, rippling.com, bamboohr.com, workablehq.com, careers-page.com, hire.lever.co]
  account: [myworkdayjobs.com, workday.com, oraclecloud.com, icims.com, taleo.net, successfactors.com,
            brassring.com, ultipro.com, jobvite.com, peopleclick.com, avature.net, cornerstoneondemand.com]
  aggregator: [arbeitnow.com, arbeitnow.co.uk, relocate.me, berlinstartupjobs.com, remotive.com, remotive.io,
               remoteok.com, himalayas.app, weworkremotely.com, jobicy.com, workingnomads.com,
               landing.jobs, wearedevelopers.com, eu-startups.com]

# ---- Remote boards reused for Europe: only worldwide / EU-open postings are kept.
