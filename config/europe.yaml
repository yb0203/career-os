# Europe search: any tech-line role Yashvi's profile fits, in the Nordics and the rest of Europe,
# that she can realistically apply to from India. Read by pipeline/europe.py. Edit freely.
#
# A role qualifies ONLY if (a) the posting offers visa sponsorship / relocation support / Blue Card,
# or (b) it is fully remote and open to India or worldwide ("EU/EMEA remote" = remote-check).

