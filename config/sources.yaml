# Tier-2 sources: job boards and aggregators. Every result still goes through the same
# gates + scorer, and postings not read straight from an ATS get a live-URL check.
# Set enabled: false to switch a source off.

search_terms:
  - product manager
  - associate product manager
  - product owner
  - growth product manager
  - growth manager
  - technical product manager
  - ai product manager
  - product lead
  - founder's office
  - chief of staff

sources:
  # --- Remote job boards (public APIs / feeds) ---
  remotive: {enabled: true}
  remoteok: {enabled: true}
  himalayas: {enabled: true}
  jobgether: {enabled: true}   # remote-worldwide, 0-5 yrs filter (added 2026-10-29)
  arbeitnow: {enabled: true}   # DACH/NL/FR; product titles only
  jobicy: {enabled: true, tags: [product, strategy, operations, growth, management]}
  weworkremotely:
    enabled: true
    feeds: [remote-product-jobs, remote-management-and-finance-jobs, remote-sales-and-marketing-jobs, all-other-remote-jobs]
  workingnomads: {enabled: true}
  themuse: {enabled: true, category: Product Management, locations: [Flexible / Remote, "Bangalore, India"]}

  # --- Community ---
  hn_whoishiring: {enabled: true}  # latest monthly "Ask HN: Who is hiring?" thread

  # --- India-focused ---
  linkedin:
    enabled: true
    # Public guest search, past 7 days. Kept small and polite: LinkedIn rate-limits heavy use.
    locations: [Bengaluru, India]
    pages: 2
  instahyre: {enabled: true, job_functions: [11], pages: 10}  # 11 = Product Management
  cutshort:
    enabled: true
    pages:
      - product-manager-jobs-in-bangalore-bengaluru
      - product-manager-jobs-in-remote

  # --- Startup / VC portfolio boards ---
  yc:
    enabled: true
    pages: [role/product-manager, role/operations, role/sales, location/india, location/remote]
  getro:  # VC boards on Getro; collection id is read from each board page
    enabled: true
    boards: [jobs.accel.com, jobs.blume.vc, jobs.3one4capital.com, careers.antler.co, jobs.generalcatalyst.com, jobs.insightpartners.com, jobs.thrivecap.com,
             jobs.khoslaventures.com, jobs.sapphireventures.com, jobs.8vc.com, jobs.techstars.com,
             jobs.firstmark.com, jobs.dcvc.com, jobs.bonfirevc.com, jobs.greycroft.com]
  consider:  # VC boards on Consider: host -> board id
    enabled: true
    boards:
      careers.peakxv.com: sequoia-capital-india
      jobs.lsvp.com: lightspeed
      jobs.sequoiacap.com: sequoia-capital
      jobs.kleinerperkins.com: kleiner-perkins
      jobs.firstround.com: first-round-capital
      jobs.gv.com: gv
      jobs.bvp.com: bessemer-ventures
      careers.chiratae.com: chiratae  # Chiratae Ventures (India)
      jobs.battery.com: battery-ventures
      jobs.felicis.com: felicis
      jobs.initialized.com: initialized
      jobs.usv.com: union-square-ventures

  # --- Scope-driven additions (2026-10-14): fresher/internship, India startup, remote-global ---
  unstop: {enabled: true}          # public JSON API: jobs + internships, India-wide (fresher friendly)
  internshala: {enabled: false}    # OFF 2026-10-29: internships/BD only, no product roles for a 3-yr PM
  wellfound: {enabled: false}       # OFF: Wellfound terms discourage scraping. Check wellfound.com by hand weekly (India + Gurgaon/Delhi/Noida)
  weekday: {enabled: true, max_pages: 150}   # Weekday sitemaps + JobPosting JSON-LD
  remoterocketship: {enabled: true}          # India + worldwide remote, links to the company's own ATS
  hasjob: {enabled: false}         # Atom feed, ~16 mixed postings; 0 survived the gates on 2026-10-14
