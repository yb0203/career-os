name: daily-job-digest

on:
  schedule:
    # GitHub starts scheduled runs 3-6 hours late (measured Oct 14-29: the old 06:47/18:47 IST crons landed at
    # ~11:30 and ~22:00-00:50 IST). Scheduled early so results land before ~07:30 and ~18:00 IST.
    - cron: "17 20 * * *"  # ~01:47 IST -> typically arrives 06:30-08:00 IST
    - cron: "17 7 * * *"   # ~12:47 IST -> typically arrives 16:00-18:30 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # LinkedIn throttling is handled with slow retries, so allow time
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m pipeline.run
      - name: Sync Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        if: env.GOOGLE_SERVICE_ACCOUNT_JSON != ''
        run: |
          python -m pipeline.sheets
          python -m pipeline.dedupe_sheet
          python -m pipeline.queue
          python -m pipeline.pm_targets
      - name: Refresh Europe tab
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        if: env.GOOGLE_SERVICE_ACCOUNT_JSON != ''
        continue-on-error: true  # a Europe-source hiccup must not block the digest commit
        run: python -m pipeline.europe_sheet
      - name: Build today's batch (20-30 roles, 8+ strong, India + visa/remote abroad)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        if: env.GOOGLE_SERVICE_ACCOUNT_JSON != ''
        continue-on-error: true
        run: python -m pipeline.daily_batch
      - name: Commit digest
        run: |
          git config user.name "career-os bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "chore(digest): daily job digest $(date -u +%F)"
          git pull --rebase -X theirs origin main && git push
