name: daily-job-digest

on:
  schedule:
    - cron: "17 1 * * *"   # ~06:47 IST (off the hour: GitHub delays or drops busy top-of-hour schedules)
    - cron: "17 13 * * *"  # ~18:47 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m pipeline.run
      - name: Sync Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        if: env.GOOGLE_SERVICE_ACCOUNT_JSON != ''
        run: |
          python -m pipeline.sheets
          python -m pipeline.queue
      - name: Refresh Europe tab
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        if: env.GOOGLE_SERVICE_ACCOUNT_JSON != ''
        continue-on-error: true  # a Europe-source hiccup must not block the digest commit
        run: python -m pipeline.europe_sheet
      - name: Commit digest
        run: |
          git config user.name "career-os bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "chore(digest): daily job digest $(date -u +%F)"
          git push
