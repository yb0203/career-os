name: daily-job-digest

on:
  schedule:
    - cron: "30 1 * * *"  # 07:00 IST every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m pipeline.run
      - name: Commit digest
        run: |
          git config user.name "career-os bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "chore(digest): daily job digest $(date -u +%F)"
          git push
